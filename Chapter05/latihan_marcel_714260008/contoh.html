<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerHTML JavaScript</title>
    <style>
        .keranjang {
            background-color: yellow;
        }

        .belisekarang {
            background-color: orange;
        }
    </style>
</head>
<body>
    <p>Juak Dimsum Murah</p>
    <p>Price: Rp.135.000</p>

    <button
        class="keranjang"
        onclick="alert('Tambah ke Keranjang');"
    >
        Keranjang
    </button>

    <button
        class="belisekarang"
        onclick="alert('Kalem loading heula...');
        alert('Atos Meser');"
    >
        Meser Ayeuna  
    </button>
</body>
</html>
